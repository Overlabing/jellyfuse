<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Jellyfuse - Connexion rapide</title>
<meta name="viewport" content="width=1920">
<style>
:root{
  --canvas:#07070B; --surface:#101018; --raised:#181824; --overlay:#212131;
  --text:#F4F4F8; --text2:#A6A6B8; --text3:#6E6E82; --stroke:rgba(255,255,255,.10);
  --accent:#8A6CFF; --spark:#FF5C8A; --ok:#3DDC97; --warn:#FFB84D; --danger:#FF5A5F;
  --grad:linear-gradient(135deg,#8A6CFF 0%,#C65BDB 55%,#FF5C8A 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000}
body{width:1920px;height:1080px;overflow:hidden;background:var(--canvas);color:var(--text);
  font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;
  font-weight:500;-webkit-font-smoothing:antialiased;transform-origin:0 0}
.tv{position:absolute;inset:0;overflow:hidden;background:var(--canvas)}
.abs{position:absolute}
/* typography: tvOS HIG sizes */
.t-large{font-size:76px;font-weight:800;letter-spacing:-1.5px;line-height:1.02}
.t-title1{font-size:76px;font-weight:700;letter-spacing:-1px}
.t-title2{font-size:57px;font-weight:700;letter-spacing:-.5px}
.t-title3{font-size:48px;font-weight:700}
.t-head{font-size:38px;font-weight:700}
.t-sub{font-size:38px;font-weight:400;color:var(--text2)}
.t-call{font-size:31px;font-weight:500}
.t-body{font-size:29px;font-weight:500}
.t-cap{font-size:25px;font-weight:500}
.t-cap2{font-size:23px;font-weight:500}
.dim{color:var(--text2)} .dim3{color:var(--text3)}
/* wordmark */
.logo{display:flex;align-items:center;gap:14px;font-weight:800;font-size:40px;letter-spacing:-1px}
.logo svg{width:40px;height:40px}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
/* nav */
.nav{position:absolute;left:0;right:0;top:0;height:170px;padding:56px 90px 0;display:flex;align-items:center;gap:64px;
  background:linear-gradient(180deg,rgba(7,7,11,.92),rgba(7,7,11,0));z-index:30}
.tabs{display:flex;gap:10px;margin-left:12px}
.tab{padding:12px 30px;border-radius:40px;font-size:31px;color:var(--text2)}
.tab.on{color:#fff;font-weight:700;position:relative}
.tab.on:after{content:"";position:absolute;left:30px;right:30px;bottom:2px;height:4px;border-radius:2px;background:var(--grad)}
.tab.f{background:rgba(255,255,255,.16);color:#fff}
.nav .sp{flex:1}
.avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:16px;height:84px;padding:0 44px;border-radius:42px;font-size:31px;font-weight:700;
  background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(20px)}
.btn svg{width:34px;height:34px;fill:currentColor}
.btn.focus{background:#fff;color:#0a0a10;transform:scale(1.08);box-shadow:0 24px 50px rgba(0,0,0,.55),0 0 70px rgba(138,108,255,.45)}
.btn.round{width:84px;padding:0;justify-content:center}
.btn.primary{background:var(--grad);color:#fff}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;height:60px;padding:0 26px;border-radius:30px;font-size:27px;font-weight:600;background:rgba(255,255,255,.10);color:var(--text)}
.chip.on{background:#fff;color:#0a0a10}
.chip.focus{background:#fff;color:#0a0a10;transform:scale(1.08);box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 50px rgba(138,108,255,.4)}
.badge{display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:8px;border:2px solid rgba(255,255,255,.45);font-size:22px;font-weight:700;color:rgba(255,255,255,.88);letter-spacing:.5px}
.badge.fill{background:rgba(255,255,255,.9);color:#0a0a10;border-color:transparent}
.meta{display:flex;align-items:center;gap:20px;font-size:29px;color:var(--text2)}
.meta .dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.meta .ok,.meta .rate{color:var(--warn);font-weight:700}
/* art placeholders */
.art{position:relative;overflow:hidden}
.art:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.22),transparent 55%)}
.art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.65))}
.art .ti{position:absolute;left:18px;right:18px;bottom:18px;z-index:2;font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.5px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.art .ini{position:absolute;right:-8px;top:-30px;z-index:1;font-size:230px;font-weight:900;color:rgba(255,255,255,.10);letter-spacing:-10px}
/* cards */
.poster{width:250px;height:375px;border-radius:14px;flex:none}
.land{width:400px;height:225px;border-radius:14px;flex:none}
.card{position:relative;flex:none}
.card.focus{transform:scale(1.12);z-index:10}
.card.focus .art,.card.focus .still{box-shadow:0 0 0 5px #fff,0 36px 70px rgba(0,0,0,.65),0 0 90px rgba(138,108,255,.50)}
.card .cap,.card .cap2{position:relative;z-index:2}
.card .cap{margin-top:16px;font-size:27px;font-weight:600;line-height:1.2}
.card .cap2{font-size:23px;color:var(--text2);margin-top:4px;font-weight:500}
.prog{position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(255,255,255,.28);z-index:3}
.prog i{display:block;height:100%;background:var(--grad)}
.flag{position:absolute;top:14px;right:14px;z-index:3;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--ok);font-weight:800}
.new{position:absolute;top:14px;left:14px;z-index:3;padding:5px 12px;border-radius:8px;background:var(--grad);font-size:20px;font-weight:800;letter-spacing:.8px}
.shelf{position:absolute;left:0;right:0}
.shelf h3{margin:0 0 26px 90px;font-size:38px;font-weight:700;letter-spacing:-.3px}
.row{display:flex;gap:40px;padding-left:90px}
.back{position:absolute;inset:0}
.vig-l{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,7,11,.96) 0%,rgba(7,7,11,.78) 32%,rgba(7,7,11,0) 70%)}
.vig-b{position:absolute;inset:0;background:linear-gradient(0deg,var(--canvas) 0%,rgba(7,7,11,.92) 22%,rgba(7,7,11,0) 60%)}
.vig-t{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,7,11,.8) 0%,rgba(7,7,11,0) 24%)}
.panel{background:rgba(24,24,36,.72);border-radius:28px;backdrop-filter:blur(40px);border:1px solid var(--stroke)}
.toggle{width:96px;height:56px;border-radius:28px;background:rgba(255,255,255,.18);position:relative}
.toggle:after{content:"";position:absolute;left:6px;top:6px;width:44px;height:44px;border-radius:50%;background:#fff}
.toggle.on{background:var(--ok)} .toggle.on:after{left:46px}

/* ---- revision HIG : marges 80/60, focus système (échelle + ombre, ni liseré ni lueur), styles de texte tvOS ---- */
.t-large{font-size:76px;font-weight:700;letter-spacing:-.5px;line-height:1.05}
.tabbar{position:absolute;left:50%;top:46px;transform:translateX(-50%);height:68px;padding:0 6px;border-radius:34px;display:flex;align-items:center;gap:4px;background:rgba(60,60,75,.55);backdrop-filter:blur(30px);z-index:30}
.tabbar div{height:56px;padding:0 30px;border-radius:28px;display:flex;align-items:center;font-size:29px;font-weight:500;color:rgba(255,255,255,.7)}
.tabbar div.on{background:rgba(255,255,255,.22);color:#fff;font-weight:700}
.btn{height:80px;padding:0 40px;border-radius:40px;font-size:31px;font-weight:700}
.btn.focus{transform:scale(1.06);box-shadow:0 20px 44px rgba(0,0,0,.5)}
.btn.round{width:80px;padding:0}
.chip.focus{transform:scale(1.06);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.poster{width:260px;height:390px}
.land{width:410px;height:231px}
.card.focus{transform:scale(1.1)}
.card.focus .art,.card.focus .still{box-shadow:0 34px 60px rgba(0,0,0,.65);filter:brightness(1.12)}
.card .cap{font-size:29px;font-weight:600}
.card .cap2{font-size:25px}
.shelf h3{margin:0 0 24px 80px;font-size:38px}
.row{padding-left:80px}
.meta{font-size:29px}

.digit{width:112px;height:150px;border-radius:24px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:92px;font-weight:700;font-variant-numeric:tabular-nums}
</style></head>

# Generated project: `xcodegen generate` (the .xcodeproj is not committed).
name: Jellyfuse
options:
  developmentLanguage: fr
  bundleIdPrefix: dev.antonin
  deploymentTarget:
    tvOS: "26.0"
    iOS: "26.0"
packages:
  JellyKit:
    path: Packages/JellyKit
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Jellyfuse:
    type: application
    platform: tvOS
    sources: [Apps/Jellyfuse]
    dependencies:
      - package: JellyKit
        products: [PlayerCore, LibraryKit, DesignSystem, HomePresentation, PlaybackEngine, PlayerPresentation, SettingsKit]
      - target: TopShelf
        embed: true
    info:
      path: Apps/Jellyfuse/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # jellyfuse://detail/{id} and jellyfuse://play/{id}: opened by the Top Shelf cards.
        CFBundleURLTypes:
          - CFBundleURLName: com.jellyfusion.app
            CFBundleURLSchemes: [jellyfuse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jellyfusion.app
        ASSET_CATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        INFOPLIST_KEY_CFBundleDisplayName: Jellyfuse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # TestFlight: HTTPS-only exempt encryption, no custom crypto.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Open ATS while developing against plain-HTTP LAN servers.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 39TMVBW2CY
        CODE_SIGN_ENTITLEMENTS: Apps/Jellyfuse/Jellyfuse.entitlements
  # iPhone + iPad. Same bundle id as the tvOS app (one multi-platform record on App Store Connect) and the
  # same shared sources; the differences live in the DesignSystem metrics.
  Jellyfuse-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/Jellyfuse
        excludes:
          - Assets.xcassets
          - Info.plist
      - path: Apps/Jellyfuse-iOS/Assets.xcassets
    dependencies:
      - package: JellyKit
        products: [LibraryKit, DesignSystem, HomePresentation, SettingsKit, PlayerCore, PlaybackEngine, PlayerPresentation]
    info:
      path: Apps/Jellyfuse-iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.jellyfusion.app
            CFBundleURLSchemes: [jellyfuse]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jellyfusion.app
        PRODUCT_NAME: Jellyfuse
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Jellyfuse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 39TMVBW2CY
  # Top Shelf extension: reads the shared session and shows « À suivre » above the dock.
  TopShelf:
    type: app-extension
    platform: tvOS
    sources: [Apps/TopShelf]
    dependencies:
      - package: JellyKit
        products: [LibraryKit]
      - sdk: TVServices.framework
    info:
      path: Apps/TopShelf/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Jellyfuse Top Shelf
        UIRequiredDeviceCapabilities: [arm64]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
        # Plain-HTTP LAN servers, like the app.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jellyfusion.app.TopShelf
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 39TMVBW2CY
        CODE_SIGN_ENTITLEMENTS: Apps/TopShelf/TopShelf.entitlements
  JellyfuseUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [Apps/JellyfuseUITests]
    dependencies:
      - target: Jellyfuse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jellyfusion.app.uitests
        TEST_TARGET_NAME: Jellyfuse
schemes:
  Jellyfuse-iOS:
    build:
      targets:
        Jellyfuse-iOS: all
  Jellyfuse:
    build:
      targets:
        Jellyfuse: all
    test:
      targets: [JellyfuseUITests]
